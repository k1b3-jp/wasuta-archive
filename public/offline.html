<!doctype html>
<html lang="ja">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="theme-color" content="#29262d" />
		<title>オフライン | わーすたアーカイブ</title>
		<style>
			*{box-sizing:border-box}body{min-height:100vh;margin:0;display:grid;place-items:center;padding:2rem;color:#29262d;background:radial-gradient(circle at 80% 15%,#f2dce8,transparent 32%),#fffdfa;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif}.card{width:min(31rem,100%);padding:2rem;border:1px solid #e4d9e2;border-radius:1.5rem;background:rgba(255,255,255,.9);box-shadow:0 1.5rem 4rem rgba(41,38,45,.1)}.mark{display:grid;width:4rem;height:4rem;place-items:center;margin-bottom:1.5rem;border-radius:1.2rem;color:#fff;background:#29262d;font-size:1.8rem}p:first-of-type{margin:.5rem 0 1rem;color:#9e5381;font-size:.7rem;font-weight:800;letter-spacing:.16em}h1{margin:0;font-size:clamp(1.8rem,8vw,2.7rem);line-height:1.15}p:last-of-type{margin:1.25rem 0;color:#6f6671;font-size:.9rem;line-height:1.9}button{min-height:3rem;padding:.75rem 1.2rem;border:0;border-radius:999px;color:#fff;background:#29262d;font:inherit;font-size:.8rem;font-weight:800;cursor:pointer}
		</style>
	</head>
	<body>
		<main class="card">
			<div class="mark" aria-hidden="true">W</div>
			<p>OFFLINE</p>
			<h1>現在、ネットワークに接続できません</h1>
			<p>接続が戻ったら、もう一度お試しください。記録の正確性を保つため、ページ本文は常に最新データを取得して表示します。</p>
			<button type="button" onclick="location.reload()">再読み込み</button>
		</main>
	</body>
</html>
